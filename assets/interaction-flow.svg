<text x="530" y="65" fill="#87BCB2" letter-spacing="2" font-size="13" font-weight="700">02 / DECIDE</text>
<text x="995" y="65" fill="#87BCB2" letter-spacing="2" font-size="13" font-weight="700">03 / RESUME</text>
<rect x="66" y="93" width="361" height="196" rx="16" fill="#1C3039" stroke="#B7FFF1" stroke-opacity=".24" filter="url(#shade)"/>
<path d="M66 130h361" stroke="#B7FFF1" stroke-opacity=".15"/><circle cx="90" cy="111" r="5" fill="#71999B"/><circle cx="107" cy="111" r="5" fill="#71999B"/><circle cx="124" cy="111" r="5" fill="#71999B"/>
