<rect x="211" y="224" width="169" height="45" rx="12" fill="none" stroke="#D3FFE8" stroke-width="3" filter="url(#soft)"/><path d="M211 246C202 219 373 213 380 242C390 280 215 288 211 246Z" fill="none" stroke="url(#edge)" stroke-width="3.5" stroke-linecap="round"/><path d="M326 285l38-28m-11 0 13-3-3 14" stroke="#D1FFF0" stroke-width="3" stroke-linecap="round"/>
