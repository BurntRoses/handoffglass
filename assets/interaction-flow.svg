<rect x="529" y="93" width="361" height="196" rx="16" fill="#1B3038" stroke="#B7FFF1" stroke-opacity=".24" filter="url(#shade)"/>
<rect x="555" y="117" width="48" height="40" rx="11" fill="#294842" stroke="#86D8B9" stroke-opacity=".5"/><path d="M571 138l10 9 11-18" fill="none" stroke="#A7F4D6" stroke-width="3" stroke-linecap="round"/>
<text x="620" y="132" fill="#E9FFF5" font-size="18" font-weight="600">Human decision</text><text x="620" y="150" fill="#84B2A8" font-size="11">The choice stays with you</text>
<path d="M555 176h301" stroke="#5A7D82" stroke-opacity=".35"/><rect x="554" y="196" width="145" height="52" rx="10" fill="#253C45" stroke="#6D9595" stroke-opacity=".36"/><text x="607" y="229" fill="#CBD9D7" font-size="14">Decline</text>
