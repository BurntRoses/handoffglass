<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="366" viewBox="0 0 1440 366" role="img" aria-labelledby="title desc">
<title id="title">HandoffGlass interaction flow</title><desc id="desc">A vector illustration of an agent highlighting a target, a person deciding, and an agent resuming work.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10202A"/><stop offset="1" stop-color="#0B141C"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D3FFF0"/><stop offset="1" stop-color="#63CCB5"/></linearGradient>
<filter id="soft"><feGaussianBlur stdDeviation="6"/></filter><filter id="shade"><feDropShadow dx="0" dy="12" stdDeviation="19" flood-opacity=".3"/></filter>
</defs>
<rect x="0.5" y="0.5" width="1439" height="365" rx="25" fill="url(#bg)" stroke="#9BDBCD" stroke-opacity=".18"/>
<g opacity=".05" stroke="#B4FFDD"><path d="M0 60h1440M0 120h1440M0 180h1440M0 240h1440M0 300h1440"/><path d="M80 0v366M160 0v366M240 0v366M320 0v366M400 0v366M480 0v366M560 0v366M640 0v366M720 0v366M800 0v366M880 0v366M960 0v366M1040 0v366M1120 0v366M1200 0v366M1280 0v366M1360 0v366"/></g>
