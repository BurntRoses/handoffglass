<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">HandoffGlass — desktop handoff, made visible</title>
  <desc id="desc">A conceptual desktop interface: a softly highlighted consent button, a luminous hand-drawn circle and a separate human decision card. Illustration, not a screenshot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111c25"/><stop offset=".58" stop-color="#0b121c"/><stop offset="1" stop-color="#101827"/></linearGradient>
    <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c5fff0"/><stop offset=".52" stop-color="#77dacb"/><stop offset="1" stop-color="#86aafa"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#293441" stop-opacity=".98"/><stop offset="1" stop-color="#17242e" stop-opacity=".98"/></linearGradient>
    <radialGradient id="haze"><stop stop-color="#65ecd0" stop-opacity=".30"/><stop offset="1" stop-color="#65ecd0" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="46"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="30" flood-color="#02070b" flood-opacity=".44"/></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#bdd5c9" stroke-opacity=".055" stroke-width="1"/></pattern>
  </defs>
  <rect width="1600" height="760" rx="30" fill="url(#bg)"/>
  <rect width="1600" height="760" rx="30" fill="url(#grid)"/>
  <circle cx="1206" cy="372" r="438" fill="url(#haze)"/>
  <path d="M0 670C300 578 407 745 712 655" fill="none" stroke="#b0e8d6" stroke-opacity=".09" stroke-width="1.5"/>
  <rect x="40" y="40" width="1520" height="680" rx="20" fill="none" stroke="#b1e7d0" stroke-opacity=".14"/>
  <rect x="92" y="90" width="43" height="43" rx="13" fill="#263a3d" stroke="#9bffde" stroke-opacity=".55"/>
  <path d="M103 110h21m-10-10v21" stroke="#a1fae0" stroke-width="2" stroke-linecap="round"/>
  <circle cx="114" cy="110" r="6" fill="#132a30" stroke="#a1fae0" stroke-width="1.8"/>
  <text x="148" y="118" font-family="Inter, Arial, Helvetica, sans-serif" fill="#eef8f3" font-size="28" font-weight="650" letter-spacing="-.8">handoffglass</text>
  <text x="92" y="253" font-family="Arial, sans-serif" fill="#7cbbac" font-size="16" letter-spacing="3.5">AGENT  /  HUMAN  /  AGENT</text>
  <text x="87" y="330" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="650" fill="#f3f8f7" letter-spacing="-2">The handoff,</text>
  <text x="87" y="399" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="650" fill="url(#aqua)" letter-spacing="-2">made visible.</text>
  <text x="92" y="466" font-family="Arial, sans-serif" font-size="22" fill="#a9b9bd">Point to the next step.</text>
  <text x="92" y="501" font-family="Arial, sans-serif" font-size="22" fill="#a9b9bd">Let people decide. Resume with context.</text>
  <rect x="92" y="565" width="188" height="43" rx="21.5" fill="#b7ffe8"/><text x="119" y="593" fill="#142321" font-size="16" font-weight="650" font-family="Arial, sans-serif">MCP + Agent Skill</text>
  <rect x="297" y="565" width="126" height="43" rx="21.5" fill="#26323c" stroke="#6d8188" stroke-opacity=".5"/><text x="317" y="593" fill="#cbddd9" font-size="16" font-family="Arial, sans-serif">Local-first</text>
  <g filter="url(#shadow)">
    <rect x="692" y="112" width="814" height="515" rx="24" fill="#17212b" stroke="#738e92" stroke-opacity=".46"/>
    <path d="M692 136q0-24 24-24h766q24 0 24 24v36H692Z" fill="#222e39"/>
    <circle cx="725" cy="144" r="6" fill="#657681"/><circle cx="747" cy="144" r="6" fill="#657681"/><circle cx="769" cy="144" r="6" fill="#657681"/>
    <rect x="852" y="130" width="454" height="28" rx="12" fill="#101b24"/>
    <text x="964" y="149" font-family="Arial, sans-serif" fill="#81949b" font-size="13">workspace / account access</text>
    <rect x="728" y="211" width="308" height="348" rx="12" fill="#1c2732" stroke="#8498a0" stroke-opacity=".17"/>
    <rect x="753" y="243" width="73" height="10" rx="5" fill="#576c78"/>
    <rect x="753" y="279" width="243" height="16" rx="8" fill="#95aeb0" fill-opacity=".22"/>
    <rect x="753" y="317" width="224" height="10" rx="5" fill="#516674"/>
    <rect x="753" y="338" width="188" height="10" rx="5" fill="#516674"/>
    <rect x="753" y="384" width="245" height="1" fill="#546b77" fill-opacity=".5"/>
    <rect x="753" y="414" width="138" height="10" rx="5" fill="#425762"/>
    <rect x="753" y="438" width="206" height="10" rx="5" fill="#425762"/>
    <rect x="753" y="485" width="107" height="38" rx="10" fill="#273642"/>
    <text x="779" y="508" font-family="Arial, sans-serif" fill="#a5bdc0" font-size="12">Back</text>
    <rect x="877" y="485" width="124" height="38" rx="10" fill="#8cddc8"/>
    <text x="903" y="509" font-family="Arial, sans-serif" fill="#18302c" font-size="13" font-weight="650">Continue</text>
    <rect x="1072" y="211" width="398" height="180" rx="14" fill="#26343d" stroke="#71999c" stroke-opacity=".35"/>
    <text x="1097" y="247" fill="#e7f2ee" font-size="16" font-family="Arial, sans-serif" font-weight="600">Review access</text>
    <text x="1097" y="281" fill="#a7bcc0" font-size="14" font-family="Arial, sans-serif">Check what this application</text>
    <text x="1097" y="302" fill="#a7bcc0" font-size="14" font-family="Arial, sans-serif">can access before continuing.</text>
    <rect x="1101" y="324" width="153" height="39" rx="10" fill="#eaf6f0"/><text x="1133" y="348" fill="#1d3531" font-size="14" font-family="Arial, sans-serif" font-weight="600">Review</text>
    <rect x="1270" y="324" width="159" height="39" rx="10" fill="#24313a" stroke="#9db7b4" stroke-opacity=".4"/><text x="1323" y="348" fill="#b9cecb" font-size="14" font-family="Arial, sans-serif">Later</text>
    <rect x="1072" y="417" width="398" height="142" rx="14" fill="url(#panel)" stroke="#b3f0da" stroke-opacity=".3"/>
    <circle cx="1103" cy="456" r="11" fill="#4f9b8e" fill-opacity=".22" stroke="#99ebd3"/>
    <path d="m1097 456 4 4 8-9" fill="none" stroke="#bafce5" stroke-width="2"/>
    <text x="1127" y="458" font-size="15" font-family="Arial, sans-serif" fill="#e9faf3" font-weight="600">Your turn</text>
    <text x="1097" y="488" fill="#afc8c5" font-size="13" font-family="Arial, sans-serif">Choose in the original window.</text>
    <rect x="1096" y="507" width="128" height="33" rx="16.5" fill="#b9ffe9"/><text x="1121" y="529" fill="#1a3530" font-size="12" font-weight="650" font-family="Arial, sans-serif">I've finished</text>
    <text x="1251" y="529" fill="#d7aaa8" font-size="12" font-family="Arial, sans-serif">Decline</text>
  </g>
  <ellipse cx="1180" cy="343" rx="102" ry="44" fill="#84fce0" opacity=".22" filter="url(#glow)"/>
  <path d="M1078 343C1055 292 1092 298 1158 295S1297 297 1312 334C1327 369 1250 386 1179 389S1084 380 1078 343Z" fill="none" stroke="#aaffde" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1096 342C1099 318 1123 314 1150 314" fill="none" stroke="#e5fff5" stroke-opacity=".8" stroke-width="1.5"/>
  <path d="M1279 276Q1338 248 1360 210" fill="none" stroke="#9debd2" stroke-opacity=".7" stroke-width="2" stroke-dasharray="7 7"/>
  <circle cx="1360" cy="209" r="5" fill="#c9ffeb"/>
  <rect x="1255" y="186" width="174" height="29" rx="14.5" fill="#a0f1da"/><text x="1280" y="206" font-size="12" font-family="Arial, sans-serif" fill="#14352d" font-weight="650">HUMAN DECISION</text>
  <text x="93" y="683" font-size="14" fill="#6c888b" font-family="Arial, sans-serif" letter-spacing="1.4">DESIGNED FOR THE MOMENT AN AGENT NEEDS YOU.</text>
  <text x="1484" y="682" text-anchor="end" font-size="13" fill="#7fa8a4" font-family="Arial, sans-serif">CONCEPT PREVIEW / 01</text>
</svg>
