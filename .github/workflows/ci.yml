name: Verify HandoffGlass
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Syntax and unit/integration bridge tests
        run: npm run verify
      - name: Real MCP SDK stdio handshake smoke test (headless)
        run: npm run test:integration
