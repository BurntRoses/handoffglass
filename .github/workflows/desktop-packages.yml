name: Build unsigned desktop previews
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'native/**'
      - 'electron-builder.config.cjs'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-overlay.mjs'
      - 'scripts/build-native-macos.mjs'
      - 'scripts/verify-package.mjs'
      - 'scripts/verify-dist.mjs'
      - '.github/workflows/desktop-packages.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install pinned project dependencies
        run: npm ci --no-audit --no-fund
      - name: Build macOS AX locator executable
        if: runner.os == 'macOS'
        run: npm run native:macos
      - name: Verify unit, IPC and platform parser
        run: npm run verify
      - name: Validate Windows PowerShell script parses
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path native/windows/locate.ps1),[ref]$null,[ref]$errors)
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Build unsigned downloadable desktop preview
        run: npm run dist:desktop
      - name: Validate packaged runtime and native resources
        run: node scripts/verify-package.mjs
      - name: Verify downloadable artifact and SHA256 manifest
        run: node scripts/verify-dist.mjs
      - name: Upload unsigned engineering preview (NOT a verified installer)
        uses: actions/upload-artifact@v4
        with:
          name: HandoffGlass-unsigned-${{ runner.os }}
          path: dist/
          retention-days: 7
