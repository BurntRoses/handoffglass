name: Build unsigned desktop previews
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'native/**'
      - 'skills/**'
      - 'integrations/workbuddy/**'
      - 'assets/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'docs/release-status.json'
      - 'electron-builder.config.cjs'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-overlay.mjs'
      - 'scripts/build-native-macos.mjs'
      - 'scripts/verify-package.mjs'
      - 'scripts/verify-dist.mjs'
      - 'scripts/packaged-mcp-smoke.mjs'
      - 'scripts/build-notices.mjs'
      - 'scripts/release-check.mjs'
      - 'scripts/release-build-receipt.mjs'
      - '.github/workflows/desktop-packages.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'native/**'
      - 'skills/**'
      - 'integrations/workbuddy/**'
      - 'assets/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'docs/release-status.json'
      - 'electron-builder.config.cjs'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-overlay.mjs'
      - 'scripts/build-native-macos.mjs'
      - 'scripts/verify-package.mjs'
      - 'scripts/verify-dist.mjs'
      - 'scripts/packaged-mcp-smoke.mjs'
      - 'scripts/build-notices.mjs'
      - 'scripts/release-check.mjs'
      - 'scripts/release-build-receipt.mjs'
      - '.github/workflows/desktop-packages.yml'
permissions:
  contents: read
concurrency:
  group: desktop-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: windows-latest
            target: win32-x64
    env:
      HANDOFFGLASS_DIST_DIR: dist/desktop-${{ matrix.target }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install pinned project dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit build and runtime dependencies for high and critical advisories
        run: npm audit --audit-level=high
      - name: Build macOS AX locator executable
        if: runner.os == 'macOS'
        run: npm run native:macos
      - name: Verify unit, IPC and platform parser
        run: npm run verify
      - name: Report preview release policy
        run: npm run release:check -- --preview
      - name: Validate Windows PowerShell script parses
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path native/windows/locate.ps1),[ref]$null,[ref]$errors)
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Build unsigned downloadable desktop preview
        run: npm run dist:desktop
      - name: Validate packaged runtime and native resources
        run: node scripts/verify-package.mjs
      - name: Verify packaged stdio MCP runtime (no extra Node process)
        run: node scripts/packaged-mcp-smoke.mjs
      - name: Verify downloadable artifact and SHA256 manifest
        run: node scripts/verify-dist.mjs
      - name: Upload unsigned engineering preview (NOT a verified installer)
        uses: actions/upload-artifact@v4
        with:
          name: HandoffGlass-unsigned-${{ matrix.target }}
          path: ${{ env.HANDOFFGLASS_DIST_DIR }}/release/
          if-no-files-found: error
          retention-days: 7
