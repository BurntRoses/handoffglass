<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'"><meta name="color-scheme" content="dark light"><link rel="stylesheet" href="ui-tokens.css"><link rel="stylesheet" href="panel.css"><title>HandoffGlass</title><link rel="stylesheet" href="disclosure.css"><script type="module" src="disclosure.mjs"></script></head><body>
<main class="panel" id="panel">
<header class="panel-header"><img src="../../assets/brandmark.svg" width="26" height="26" alt=""><div class="header-context"><span id="step">当前步骤</span><span id="phase" role="status" aria-live="polite">准备引导</span></div><div class="header-actions"><button class="ui-button" type="button" id="pause">暂停</button><button class="ui-button" type="button" id="collapse" aria-expanded="true">收起</button><button class="ui-button" type="button" id="cancel">结束</button></div></header>
<div id="cardBody" class="card-body"><section class="panel-content"><h1 id="title">需要你操作</h1><p id="message"></p><p class="panel-caption" id="note" role="status" hidden></p></section>
<div id="recoveryActions" class="recovery-actions" hidden><button class="ui-button" type="button" id="retry">重新定位</button><button class="ui-button" type="button" id="fallback">改用文字提示</button></div>
<footer class="panel-footer"><span id="status" role="status" aria-live="polite"></span><div class="panel-actions"><button class="ui-button secondary" type="button" id="decline">拒绝</button><button class="ui-button action-primary" type="button" id="done"><span id="doneLabel">我已完成</span></button></div></footer>
<details id="stepDetails" class="step-details"><summary id="detailsLabel">当前状态</summary><p id="detailText"></p><button class="ui-button" type="button" id="execution">挂起会话</button></details></div>
<div class="strip-footer"><span id="elapsed"></span><span id="timer" hidden></span></div>
</main><script type="module" src="panel.js"></script></body></html>
