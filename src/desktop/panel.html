<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'"/><meta name="color-scheme" content="dark light"/><link rel="stylesheet" href="ui-tokens.css"/><link rel="stylesheet" href="panel.css"/><title>HandoffGlass · Handoff</title></head><body>
<main class="panel" id="panel">
  <header class="panel-header">
    <div class="panel-brand"><img src="../../assets/brandmark.svg" width="29" height="29" alt=""/><span>handoffglass</span><span class="panel-divider"></span><span class="panel-mode" id="tag">HANDOFF</span></div>
    <span class="panel-state"><i class="state-dot"></i><span id="status">等待用户操作</span></span>
  </header>
  <section class="panel-content">
    <div class="section-kicker"><span class="rail-line"></span><span id="phase">AGENT → HUMAN</span></div>
    <h1 id="title">等待操作指引</h1>
    <p id="message" role="status" aria-live="polite">下一步操作会在这里出现。</p>
  </section>
  <footer class="panel-footer">
    <div class="panel-meta"><span class="meta-icon" aria-hidden="true">◷</span><span id="timer">等待连接</span></div>
    <div class="panel-actions">
      <button class="secondary danger" type="button" id="decline">拒绝</button>
      <button class="secondary" type="button" id="cancel">取消</button>
      <button class="action-primary" type="button" id="done"><span class="action-check" aria-hidden="true">✓</span><span id="doneLabel">我已完成</span></button>
    </div>
    <div class="panel-caption" id="note">请在原始窗口中核对内容。</div>
  </footer>
</main><script src="panel.js"></script></body></html>
