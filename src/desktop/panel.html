<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'"><meta name="color-scheme" content="dark light"><link rel="stylesheet" href="ui-tokens.css"><link rel="stylesheet" href="panel.css"><title>HandoffGlass</title><link rel="stylesheet" href="disclosure.css"><script type="module" src="disclosure.mjs"></script></head><body>
<main class="panel" id="panel">
<header class="panel-header"><img src="../../assets/brandmark.svg" width="26" height="26" alt=""><div class="header-context"><span id="step">当前步骤</span><span class="phase-row"><span class="state-mark" aria-hidden="true"></span><span id="phase" role="status" aria-live="polite">准备引导</span></span></div><div class="header-actions"><button class="ui-button icon-button" type="button" id="pause" aria-label="暂停" title="暂停"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="pause-icon" d="M9 5v14M15 5v14"/><path class="play-icon" d="m9 5 10 7-10 7Z"/></svg></button><button class="ui-button icon-button" type="button" id="collapse" aria-expanded="true" aria-label="收起" title="收起"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><button class="ui-button icon-button" type="button" id="cancel" aria-label="结束" title="结束"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div></header>
<p id="status" class="action-status" role="status" aria-live="polite"></p>
<div id="cardBody" class="card-body"><section class="panel-content"><h1 id="title">需要你操作</h1><p id="message"></p><p id="protectedNote" class="panel-caption" hidden></p><p class="panel-caption" id="note" role="status" hidden></p></section>
<div id="recoveryActions" class="recovery-actions" hidden><button class="ui-button" type="button" id="retry">重新定位</button><button class="ui-button" type="button" id="fallback">改用文字提示</button></div>
<footer class="panel-footer"><div class="panel-actions"><button class="ui-button secondary" type="button" id="decline">拒绝</button><button class="ui-button action-primary" type="button" id="done"><span id="doneLabel">我已完成</span></button></div></footer>
<details id="stepDetails" class="step-details"><summary id="detailsLabel">当前状态</summary><p id="detailText"></p><button class="ui-button" type="button" id="execution">挂起会话</button></details>
<div class="strip-footer"><span id="elapsed"></span><span id="timer" hidden></span></div></div>
</main><script type="module" src="panel.js"></script><script type="module" src="../../assets/ui/focus-policy.mjs"></script></body></html>
