<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'"><meta name="color-scheme" content="dark light"><link rel="stylesheet" href="ui-tokens.css"><link rel="stylesheet" href="panel.css"><title>HandoffGlass</title></head><body>
