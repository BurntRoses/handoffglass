<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self';"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="panel.css"></head><body>
<main class="panel">
  <header><div class="brand"><span class="brandmark">↗</span> HandoffGlass <span class="tag" id="tag">HANDOFF</span></div><span class="status" id="status">等待用户操作</span></header>
  <div class="rule"></div>
  <div class="eyebrow">AGENT → HUMAN → AGENT</div>
  <h1 id="title">等待操作指引</h1>
  <p id="message" role="status" aria-live="polite">Agent 会在这里告诉你下一步。</p>
  <div class="foot">
    <div class="timer" id="timer" aria-live="off"></div>
    <div class="actions">
      <button type="button" class="ghost" id="decline" aria-label="拒绝此操作">拒绝</button>
      <button type="button" class="ghost" id="cancel">取消引导</button>
      <button type="button" class="primary" id="done">我已完成</button>
    </div>
    <div class="note">请先核对原始窗口中的权限和操作内容。本工具不会替你点击或授权。</div>
  </div>
</main><script src="panel.js"></script></body></html>
