<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'"><meta name="color-scheme" content="dark light"><title>HandoffGlass</title><link rel="stylesheet" href="ui-tokens.css"><link rel="stylesheet" href="setup.css"><script src="setup.js" defer></script></head><body>
<main class="setup"><header class="setup-brand"><img src="../../assets/brandmark.svg" width="40" height="40" alt=""><span>HandoffGlass</span></header>
<section class="workspace" aria-label="Setup"><nav class="step-track" aria-label="Setup progress"><button class="step is-active" data-step="0" aria-current="step" type="button"><span data-t="agent">连接</span></button><span class="step-rule"></span><button class="step" data-step="1" type="button"><span data-t="appearance">外观</span></button><span class="step-rule"></span><button class="step" data-step="2" type="button"><span data-t="ready">完成</span></button></nav>
<div class="workspace-body">
<section class="screen" data-screen="0" aria-labelledby="chooseHeading"><h1 id="chooseHeading" data-t="choose">连接应用</h1><label class="field"><span data-t="host">应用</span><select id="host"><option value="codex">Codex</option><option value="claude">Claude</option><option value="cursor">Cursor</option><option value="vscode">VS Code</option><option value="trae">TRAE</option><option value="workbuddy">WorkBuddy</option><option value="deepseek">DeepSeek Harness</option><option value="gemini">Gemini CLI</option><option value="opencode">OpenCode</option><option value="cline">Cline</option><option value="windsurf">Windsurf</option><option value="zed">Zed</option></select></label>
<div class="config-actions"><p data-t="hostNote">将配置添加到应用，重新连接工具。</p><button class="action-quiet" id="copy" type="button" disabled data-t="copy">复制配置</button></div><details class="config-details"><summary data-t="configTitle">查看配置</summary><span id="format" class="code-type">TOML</span><pre id="configPreview" class="code-block" tabindex="0" aria-label="MCP configuration"></pre></details>
</section>
<section class="screen" data-screen="1" hidden aria-labelledby="appearanceHeading"><h1 id="appearanceHeading" data-t="visual">外观</h1><div class="fields">
<label class="field"><span data-t="style">标注</span><select id="visualStyle"><option value="minimal" data-o="minimal">极简</option><option value="handdrawn" data-o="handdrawn">手绘</option><option value="luminous" data-o="luminous">柔光</option></select></label>
<label class="field"><span data-t="motion">动态</span><select id="motion"><option value="gentle" data-o="gentle">柔和</option><option value="expressive" data-o="expressive">丰富</option><option value="off" data-o="off">关闭</option></select></label>
<label class="field"><span data-t="theme">主题</span><select id="theme"><option value="system" data-o="system">跟随系统</option><option value="light" data-o="light">浅色</option><option value="dark" data-o="dark">深色</option></select></label>
<label class="field"><span data-t="language">语言</span><select id="locale"><option value="zh-CN">简体中文</option><option value="en-US">English</option></select></label>
<label class="field"><span data-t="density">间距</span><select id="density"><option value="normal" data-o="normal">标准</option><option value="compact" data-o="compact">紧凑</option></select></label></div>
<label class="consent"><input type="checkbox" id="accessibility"><span data-t="inspect">允许定位屏幕控件</span></label><button class="inline-link" id="permission" type="button" data-t="permission">辅助功能设置</button></section>
<section class="screen finish-screen" data-screen="2" hidden aria-labelledby="readyHeading"><svg class="finish-icon" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="20"/><path d="m15 24 6 6 13-13"/></svg><h1 id="readyHeading" data-t="done">设置已保存</h1><p data-t="doneDesc">返回应用，重新连接 HandoffGlass 工具。</p></section>
</div><p class="feedback" id="feedback" role="status" aria-live="polite"></p><footer class="workspace-footer"><button id="back" class="button-back" data-t="back" type="button" disabled>返回</button><button id="next" class="button-next" type="button"><span data-t="next">继续</span></button></footer>
</section></main></body></html>
